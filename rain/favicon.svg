<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="cloudGradient" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#81D4FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#29B6F6;stop-opacity:1" />
    </radialGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1" result="blur"/>
      <feOffset in="blur" dx="1" dy="2"/>
      <feBlend in="SourceGraphic" in2="blur" mode="normal"/>
    </filter>
  </defs>
  <filter id="softBlur">
    <feGaussianBlur stdDeviation="0.5"/>
  </filter>
  <g fill="url(#cloudGradient)" filter="url(#softShadow)">
    <circle cx="42" cy="48" r="12"/>
    <circle cx="33" cy="45" r="14"/>
    <circle cx="24" cy="48" r="12"/>
    <circle cx="15" cy="44" r="11"/>
    <circle cx="27" cy="35" r="10"/>
    <ellipse cx="33" cy="42" rx="20" ry="10"/>
  </g>
</svg>