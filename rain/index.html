<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Rain Simulation</title>
<script src="https://cdn.plot.ly/plotly-2.18.2.min.js"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body onload="draw();">
        <div class="container">
            <header>
                <h1>Rain Simulation</h1>
                <p class="subtitle">
                    Interactive physics simulation with collision detection and real-time
                    analytics
                </p>
            </header>

            <div class="main-grid">
                <div class="canvas-wrapper">
                    <canvas id="canvas" width="1000" height="500"></canvas>
                </div>

                <div class="sidebar">
                    <div class="control-panel">
                        <h2>Controls</h2>
                        <div class="button-group">
                            <button class="primary" onclick="go();" aria-label="Start once">
                                GO Once
                            </button>
<button id="autorun-btn" class="toggle" onclick="autorun();" aria-label="Auto run">
    Auto
</button>
                            <button onclick="reset();" aria-label="Reset">
                                Reset
                            </button>
                        </div>

                        <div class="slider-group">
                            <div class="slider-header">
                                <span class="slider-label">Number of raindrops</span>
                                <span class="slider-value" id="raindrops_value">500</span>
                            </div>
<input
                            type="range"
                            min="100"
                            max="1000"
                            step="100"
                            value="500"
                            id="number_of_raindrops"
                            oninput="update_raindrops();"
                            aria-label="Number of raindrops"
                        />
                        </div>

<div class="slider-group">
                            <div class="slider-header">
                                <span class="slider-label">Actor speed</span>
                                <span class="slider-value" id="speed_value">5</span>
                            </div>
                            <input
                                type="range"
                                min="1"
                                max="20"
                                step="1"
                                value="5"
                                id="speed_range"
                                oninput="update_speed();"
                                aria-label="Speed"
                            />
                        </div>
                            <div class="speed-bar-container">
                                <div class="speed-bar" id="speed_bar"></div>
                            </div>
                            <input
                                type="range"
                                min="1"
                                max="20"
                                step="1"
                                value="5"
                                id="speed_range"
                                onchange="update_speed();"
                                aria-label="Speed"
                            />
                        </div>
                    </div>
                </div>
            </div>

            <div class="control-panel">
                <h2>Analytics</h2>
                <div id="graph"></div>
            </div>
        </div>
    </body>
    <script type="text/javascript" src="script.js"></script>
</html>
